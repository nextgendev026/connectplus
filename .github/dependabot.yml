version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Prisma majors are not a dependency bump, they are a migration.
    #
    # Prisma 7 removed `url` and `directUrl` from the datasource block, so bumping
    # the CLI alone leaves the schema invalid and `prisma generate` — which runs on
    # postinstall — fails the whole build. Both packages must move together, and only
    # after the schema has been ported to `prisma.config.ts` plus a driver adapter.
    # Left to itself Dependabot opens exactly that half-migration, and every deploy
    # preview on that branch goes red for a PR that must not be merged. The version
    # is unpinned-on-purpose at 6.x; see "Database Migrations" in DEPLOYING.md before
    # lifting this ignore.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"