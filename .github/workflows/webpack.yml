name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DIRECT_URL: ${{ secrets.DIRECT_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Intent tests
      run: npm run test:intent

    - name: Build
      run: npm run build -- --webpack

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      env:
        CI: "1"
        AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-only-secret' }}
      run: npm run test:e2e

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report
        retention-days: 7

  deploy-cloudflare:
    # The publishing pipeline. Vercel is paused (usage exhausted) and no longer
    # in the request path: this job builds the Next app with the OpenNext
    # Cloudflare adapter and deploys it to the `connectplus-app` Worker, which
    # the `connectplus-edge` Worker fronts as the cache and media plane.
    #
    # Runs after `check` (so a red typecheck/lint/test never publishes) and only
    # on main. Skips cleanly when the Cloudflare secrets are absent, so a fork
    # without them is not a failing build.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      run: npm ci

    - name: Generate Prisma client
      if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      run: npx prisma generate

    - name: Build for Cloudflare Workers
      if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DIRECT_URL: ${{ secrets.DIRECT_URL }}
        NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-build-only-secret' }}
      run: npx opennextjs-cloudflare build

    - name: Deploy to Cloudflare
      if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      run: npx opennextjs-cloudflare deploy

  migrate:
    needs: check
    runs-on: ubuntu-latest
    # The database guard used to live on this job's `if` beside the ref check —
    # but `env` is not a legal context in a job-level `if`, and an expression
    # the planner cannot parse makes the ENTIRE workflow invalid: every run was
    # created and failed in the same second with zero jobs scheduled, so the
    # check job never ran either. Step-level `if` does have `env`, so the
    # no-database case is a skip where it is legal instead of a run that never
    # starts.
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      if: env.DATABASE_URL != '' && env.DATABASE_URL != null
      run: npm ci

    - name: Apply production migrations
      if: env.DATABASE_URL != '' && env.DATABASE_URL != null
      # The repo's guarded path (assert-db-target), not a raw deploy: a
      # DATABASE_URL pointing at the legacy project must fail closed here too,
      # exactly as it does when Vercel runs the same script on every build.
      run: npm run db:migrate:prod