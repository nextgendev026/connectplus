# Cloudflare Worker: edge cache proxy in front of the Vercel deployment.
#
# Sized for the Workers *free* plan: 100k requests/day, 10ms CPU per request.
# One KV namespace (the SNAPSHOTS binding below), no Durable Objects, no R2.
# Reads and writes stay inside KV's own free tier, and the worker works without
# the binding at all — see the fallback note next to it.
#
# Deploy without wrangler installed:
#   CLOUDFLARE_API_TOKEN=... node scripts/deploy-worker.mjs
#
# Or with wrangler:
#   npx wrangler deploy --config workers/edge-cache/wrangler.toml

name = "connectplus-edge"
main = "src/index.mjs"
compatibility_date = "2026-09-01"

# ── Durable snapshots ─────────────────────────────────────────────────────────
# The worker keeps its own copy of the livescore and status payloads so a cron
# tick can tell whether it has anything to rebuild. The Cache API is per-colo:
# a copy warmed by a reader in Nairobi is invisible to the tick running in
# another data centre, and the record of the last tick was equally local — which
# is how "the cron never ran" and "you asked a different colo" looked identical.
#
# KV is the binding that makes that copy global. `scripts/deploy-worker.mjs`
# resolves (or creates) the namespace and injects the binding, so deploying that
# way needs no id here. To deploy with wrangler instead, create a namespace and
# fill in its id:
#   npx wrangler kv namespace create connectplus-edge-snapshots
#
# Without the binding the worker falls back to the Cache API and everything
# still works — it simply rebuilds more often and reports tick state per colo.
#
# [[kv_namespaces]]
# binding = "SNAPSHOTS"
# id = "<namespace id>"

# Served at https://connectplus-edge.<your-subdomain>.workers.dev
workers_dev = true

[vars]
# The Vercel origin this worker fronts. Change here, or override per-environment.
ORIGIN = "https://connectplusapp.vercel.app"

# ── The second durable store (free-tier distribution) ────────────────────────
# Cloudflare KV's free plan allows 1,000 *writes* a day. The worker's tick
# ledger alone is rewritten on every trigger (~1,150/day at the current
# cadence), so the ledger and the livescore snapshot are sharded onto the app's
# own cache tier instead — `https://<app>/api/edge/kv`, which is Upstash /
# Vercel-KV backed and free-counted by command, not by write-per-tick forever.
#
# Pinned here so both deploy paths shard by default: this value serves a
# `npx wrangler deploy`, and scripts/deploy-worker.mjs derives the same URL
# from ORIGIN when its environment does not supply one. Set both to empty
# (script: REMOTE_KV_URL=off) to pin a deployment to KV only — every write
# then behaves exactly as before, KV first with a remote fallback.
# It uses the same CRON_SECRET already configured for the cron pings. See
# "Free tier" in README.md for the full distribution.
REMOTE_KV_URL = "https://connectplusapp.vercel.app/api/edge/kv"

# Secrets (set with `wrangler secret put`, or by scripts/deploy-worker.mjs):
#   CRON_SECRET — the same shared secret /api/cron verifies, so this worker can
#                 drive the jobs it owns. Without it the pings are still sent but
#                 the app refuses them (401), which the console reports as stale.

[triggers]
# Cloudflare owns the high-frequency jobs whose staleness is user-visible: the
# radio metadata sweep (the "radio degraded" warning) and the livescore /
# prediction cadence. They map one-to-one onto SCHEDULES in src/index.mjs, and
# each entry there names the job id in src/lib/cron-schedule.ts.
#
# A trigger only reaches the origin when the worker's own cached snapshot for
# that job has actually gone stale (SNAPSHOTS in src/index.mjs) — under reader
# traffic the board keeps that copy current and the tick costs Vercel nothing.
#
# FIVE triggers, which is the free plan's ceiling. This list had six once and the
# API silently rejected the whole upload, so `thumbnail-recovery` never had a
# trigger at all. Keep it at five: low-frequency jobs are covered by the
# `due-sweep` on the */15 slot, which runs whatever the app's registry reports as
# overdue. `scripts/deploy-worker.mjs` now fails the deploy if this is exceeded.
crons = [
  "*/2 * * * *",    # sports-live        — snapshot + settle picks
  "*/5 * * * *",    # sports-notify      — favourite match alerts
  "*/15 * * * *",   # radio-status-sweep + due-sweep (every overdue job)
  "*/30 * * * *",   # sports-intel       — model training + pick regeneration
  "30 */6 * * *",   # payments-lifecycle — reconcile PayPal, expire lapsed plans
]

[observability]
enabled = true
